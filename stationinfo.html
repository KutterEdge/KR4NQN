<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Station Dashboard</title>

<style>
  body {
    margin: 0;
    background: #14181A;
    font-family: Arial, sans-serif;
    color: #e6e6e6;
  }

  .header {
    text-align: center;
    padding: 25px 0 10px;
    font-size: 1.6rem;
    letter-spacing: 0.15em;
    color: #66fcf1;
  }

  .callsign {
    text-align: center;
    font-size: 2.6rem;
    font-weight: bold;
    letter-spacing: 0.25em;
    margin-bottom: 25px;
  }

  .callsign span:nth-child(1) { color: #ff3b3b; }
  .callsign span:nth-child(2) { color: #ffffff; }
  .callsign span:nth-child(3) { color: #3b6cff; }
  .callsign span:nth-child(4) { color: #ff3b3b; }
  .callsign span:nth-child(5) { color: #ffffff; }
  .callsign span:nth-child(6) { color: #3b6cff; }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 25px;
    padding: 0 40px 40px;
  }

  .panel {
    background: #000000;
    border: 2px solid #2bff00;
    border-radius: 10px;
    padding: 20px;
    box-shadow: 0 0 25px rgb(4, 0, 253);
  }

  .panel-title {
    font-size: 2rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: #ff0000;
    margin-bottom: 15px;
    text-align: center;
  }

  .time {
    font-size: 5rem;
    text-align: center;
    margin: 10px 0;
  }

  iframe {
    width: 100%;
    height: 260px;
    border: none;
    border-radius: 10px;
  }

  .data {
    font-size: 1.2rem;
    text-align: center;
    margin-top: 10px;
  }
</style>
</head>

<body>

<div class="header">Station Clock & Propagation Dashboard</div>

<div class="callsign">
  <span>K</span><span>R</span><span>4</span><span>N</span><span>Q</span><span>N</span>
</div>

<div class="grid">

  <!-- UTC Clock -->
  <div class="panel">
    <div class="panel-title">UTC Time</div>
    <div id="utcTime" class="time">--:--:--</div>
    <br><div class="panel-title">Local Time</div>
    <div id="localTime" class="time">--:--:--</div>
  </div>

  <!-- Local Clock -->
  <div class="panel">
    <div class="panel-title">Navigation</div>
    <div class="header"><a href="#index.html" target="_blank">HOME</a></div>
    <br><div class="header"><a href="https://www.qrz.com/db/kr4nqn" target="_blank">QRZ.COM</a></div>
    <br><div class="header"><a href="https://wireless2.fcc.gov/UlsApp/UlsSearch/results.jsp" target="_blank">FCC Database</a></div>
  </div>

  <!-- Day/Night Map -->
  <div class="panel">
  <div class="panel-title">Day / Night Map</div>
  <canvas id="dayNightMap" width="600" height="300" style="width:100%; border-radius:10px;"></canvas>
</div>

  <!-- Solar Data -->
  <div class="panel">
  <div class="panel-title">Solar & Geomagnetic Data</div>
  <div id="solarData" class="data">
    Loading solar data...
  </div>
</div>


  <!-- HF Band Conditions -->
  <div class="panel">
  <div class="panel-title">HF Band Conditions</div>
  <div id="hfData" class="data">
    Loading HF band conditions...
  </div>
</div>


  <!-- NOAA Space Weather -->
  <div class="panel">
  <div class="panel-title">NOAA Space Weather</div>
  <pre id="noaaData" class="data" style="white-space: pre-wrap; text-align:left;">
    Loading NOAA data...
  </pre>
</div>




</div>


<script>
  function pad(n) { return n.toString().padStart(2, '0'); }

  function updateTimes() {
    const now = new Date();

    // Local
    const lh = pad(now.getHours());
    const lm = pad(now.getMinutes());
    const ls = pad(now.getSeconds());
    document.getElementById('localTime').textContent = `${lh}:${lm}:${ls}`;

    // UTC
    const uh = pad(now.getUTCHours());
    const um = pad(now.getUTCMinutes());
    const us = pad(now.getUTCSeconds());
    document.getElementById('utcTime').textContent = `${uh}:${um}:${us}`;
  }

  updateTimes();
  setInterval(updateTimes, 1000);
</script>

<script>
function drawDayNightMap() {
  const canvas = document.getElementById("dayNightMap");
  const ctx = canvas.getContext("2d");

  const img = new Image();
  img.src = "https://upload.wikimedia.org/wikipedia/commons/thumb/8/80/World_map_-_low_resolution.svg/1024px-World_map_-_low_resolution.svg.png";

  img.onload = () => {
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

    const now = new Date();
    const jd = now.getTime() / 86400000 + 2440587.5;
    const n = jd - 2451545.0;

    const L = (280.46 + 0.9856474 * n) % 360;
    const g = (357.528 + 0.9856003 * n) % 360;
    const lambda = L + 1.915 * Math.sin(g * Math.PI / 180) + 0.020 * Math.sin(2 * g * Math.PI / 180);

    const epsilon = 23.439 - 0.0000004 * n;
    const alpha = Math.atan2(Math.cos(epsilon * Math.PI / 180) * Math.sin(lambda * Math.PI / 180),
                             Math.cos(lambda * Math.PI / 180)) * 180 / Math.PI;

    const dec = Math.asin(Math.sin(epsilon * Math.PI / 180) * Math.sin(lambda * Math.PI / 180)) * 180 / Math.PI;

    const gst = (18.697374558 + 24.06570982441908 * n) % 24;
    const lon = (gst * 15 - alpha + 180) % 360 - 180;

    ctx.fillStyle = "rgba(0,0,0,0.45)";
    ctx.beginPath();

    for (let x = 0; x < canvas.width; x++) {
      const mapLon = (x / canvas.width) * 360 - 180;
      const angle = Math.abs(mapLon - lon);

      if (angle > 90) {
        ctx.fillRect(x, 0, 1, canvas.height);
      }
    }

    ctx.closePath();
  };
}

drawDayNightMap();
setInterval(drawDayNightMap, 60000);
</script>

<script>
async function loadSolarData() {
  const box = document.getElementById("solarData");

  try {
    const response = await fetch("https://www.hamqsl.com/solarjson.php");
    const data = await response.json();

    const s = data.solar;
    const g = data.geomag;

    box.innerHTML = `
      <div style="font-size:1.3rem; margin-bottom:10px;">
        <strong>SFI:</strong> ${s.sfi} &nbsp; | &nbsp;
        <strong>Sunspots:</strong> ${s.sunspots}
      </div>

      <div style="font-size:1.3rem; margin-bottom:10px;">
        <strong>A-index:</strong> ${g.aindex} &nbsp; | &nbsp;
        <strong>K-index:</strong> ${g.kindex}
      </div>

      <div style="font-size:1.2rem; margin-bottom:10px;">
        <strong>X-ray Flux:</strong> ${s.xray}
      </div>

      <div style="font-size:1.2rem;">
        <strong>Conditions:</strong> ${g.conditions}
      </div>
    `;
  } catch (err) {
    box.innerHTML = "Error loading solar data.";
  }
}

loadSolarData();
setInterval(loadSolarData, 60000);
</script>

<script>
async function loadHFData() {
  const box = document.getElementById("hfData");

  try {
    const response = await fetch("https://www.hamqsl.com/solarjson.php");
    const data = await response.json();

    const hf = data.hfconditions;

    box.innerHTML = `
      <div style="font-size:1.3rem; margin-bottom:10px;">
        <strong>80m:</strong> ${hf.band80} &nbsp; | &nbsp;
        <strong>40m:</strong> ${hf.band40}
      </div>

      <div style="font-size:1.3rem; margin-bottom:10px;">
        <strong>30m:</strong> ${hf.band30} &nbsp; | &nbsp;
        <strong>20m:</strong> ${hf.band20}
      </div>

      <div style="font-size:1.3rem; margin-bottom:10px;">
        <strong>17m:</strong> ${hf.band17} &nbsp; | &nbsp;
        <strong>15m:</strong> ${hf.band15}
      </div>

      <div style="font-size:1.3rem; margin-bottom:10px;">
        <strong>12m:</strong> ${hf.band12} &nbsp; | &nbsp;
        <strong>10m:</strong> ${hf.band10}
      </div>

      <div style="font-size:1.2rem;">
        <strong>Day/Night:</strong> ${hf.daynight}
      </div>
    `;
  } catch (err) {
    box.innerHTML = "Error loading HF band conditions.";
  }
}

loadHFData();
setInterval(loadHFData, 60000);
</script>

<script>
async function loadNOAAData() {
  const box = document.getElementById("noaaData");

  try {
    const response = await fetch("https://services.swpc.noaa.gov/text/solar-geophysical-event.txt");
    const text = await response.text();

    box.textContent = text;
  } catch (err) {
    box.textContent = "Error loading NOAA space weather data.";
  }
}

loadNOAAData();
setInterval(loadNOAAData, 60000);
</script>


</body>
</html>
