<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Station Dashboard</title>

<style>
  body {
    margin: 0;
    background: #14181A;
    font-family: Arial, sans-serif;
    color: #e6e6e6;
  }

  .header {
    text-align: center;
    padding: 25px 0 10px;
    font-size: 1.6rem;
    letter-spacing: 0.15em;
    color: #66fcf1;
  }

  .callsign {
    text-align: center;
    font-size: 2.6rem;
    font-weight: bold;
    letter-spacing: 0.25em;
    margin-bottom: 25px;
  }

  .callsign span:nth-child(1) { color: #ff3b3b; }
  .callsign span:nth-child(2) { color: #ffffff; }
  .callsign span:nth-child(3) { color: #3b6cff; }
  .callsign span:nth-child(4) { color: #ff3b3b; }
  .callsign span:nth-child(5) { color: #ffffff; }
  .callsign span:nth-child(6) { color: #3b6cff; }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 25px;
    padding: 0 40px 40px;
  }

  .panel {
    background: #000000;
    border: 2px solid #2bff00;
    border-radius: 10px;
    padding: 20px;
    box-shadow: 0 0 25px rgb(4, 0, 253);
  }

  .panel-title {
    font-size: 2rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: #ff0000;
    margin-bottom: 15px;
    text-align: center;
  }

  .time {
    font-size: 5rem;
    text-align: center;
    margin: 10px 0;
  }

  iframe {
    width: 100%;
    height: 260px;
    border: none;
    border-radius: 10px;
  }

  .data {
    font-size: 1.2rem;
    text-align: center;
    margin-top: 10px;
  }
</style>
</head>

<body>

<div class="header">Station Clock & Propagation Dashboard</div>

<div class="callsign">
  <span>K</span><span>R</span><span>4</span><span>N</span><span>Q</span><span>N</span>
</div>

<div class="grid">

  <!-- UTC Clock -->
  <div class="panel">
    <div class="panel-title">UTC Time</div>
    <div id="utcTime" class="time">--:--:--</div>
    <br><div class="panel-title">Local Time</div>
    <div id="localTime" class="time">--:--:--</div>
  </div>

  <!-- Local Clock -->
  <div class="panel">
    <div class="panel-title">Navigation</div>
    <div class="header"><a href="#index.html" target="_blank">HOME</a></div>
    <br><div class="header"><a href="https://www.qrz.com/db/kr4nqn" target="_blank">QRZ.COM</a></div>
    <br><div class="header"><a href="https://wireless2.fcc.gov/UlsApp/UlsSearch/results.jsp" target="_blank">FCC Database</a></div>
  </div>

  <!-- Day/Night Map -->
  <div class="panel">
    <div class="panel-title">Day / Night Map</div>
    <iframe src="https://www.timeanddate.com/worldclock/sunearth.html"></iframe>
  </div>

  <!-- Solar Data -->
  <div class="panel">
    <div class="panel-title">Solar & Geomagnetic Data</div>
    <iframe src="https://www.hamqsl.com/solar.html"></iframe>
  </div>

  <!-- HF Band Conditions -->
  <div class="panel">
    <div class="panel-title">HF Band Conditions</div>
    <iframe src="https://www.hamqsl.com/solar2.html"></iframe>
  </div>

  <!-- NOAA Space Weather -->
  <div class="panel">
    <div class="panel-title">NOAA Space Weather</div>
    <iframe src="https://services.swpc.noaa.gov/text/solar-geophysical-event.txt"></iframe>
  </div>



</div>


<script>
  function pad(n) { return n.toString().padStart(2, '0'); }

  function updateTimes() {
    const now = new Date();

    // Local
    const lh = pad(now.getHours());
    const lm = pad(now.getMinutes());
    const ls = pad(now.getSeconds());
    document.getElementById('localTime').textContent = `${lh}:${lm}:${ls}`;

    // UTC
    const uh = pad(now.getUTCHours());
    const um = pad(now.getUTCMinutes());
    const us = pad(now.getUTCSeconds());
    document.getElementById('utcTime').textContent = `${uh}:${um}:${us}`;
  }

  updateTimes();
  setInterval(updateTimes, 1000);
</script>

</body>
</html>
