<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kutter Edge Radio Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
    body {
        background: #0d0d0d;
        color: #e0e0e0;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
    }

    header {
        padding: 20px;
        text-align: center;
        background: #111;
        border-bottom: 2px solid #222;
    }

    h1 {
        margin: 0;
        font-size: 32px;
        letter-spacing: 2px;
        text-transform: uppercase;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
        gap: 20px;
        padding: 20px;
    }

    .tile {
        background: #1a1a1a;
        padding: 50px;
        border-radius: 1px;
        border: 1px solid #333;
        box-shadow: 0 0 10px #000;
    }

    .tile h2 {
        margin-top: 0;
        font-size: 20px;
        border-bottom: 1px solid #333;
        padding-bottom: 10px;
        text-transform: uppercase;
    }

    iframe {
        width: 100%;
        height: 300px;
        border: none;
        border-radius: 6px;
    }
</style>
</head>

<body>

<header>
      <center><div class="brand">| KR4NQN |</div>
      <nav>| <a href="https://www.qrz.com/db/KR4NQN" target="_blank">QRZ</a> |
        <a href="https://wireless2.fcc.gov/UlsApp/UlsSearch/results.jsp" target="_blank">FCC
          license</a> |
      </nav></center>
</header>

<div class="grid">

    <!-- Solar Data -->
    <div class="tile">
        <h2>Solar & Space Weather</h2>
        <iframe src="https://hamqsl.com/solar.html"></iframe>
    </div>

    <!-- HF Conditions -->
    <div class="tile">
        <h2>HF Band Conditions</h2>
        <iframe src="https://hamqsl.com/solar2.html"></iframe>
    </div>

    <!--HF Band Analyzer-->
    <div class="tile">
    <h2>HF Band Analyzer</h2>
    <div id="hf-status">Loading HF conditions...</div>
</div>

    <!-- Lightning Map -->
    <div class="tile">
        <h2>Lightning Activity</h2>
        <iframe src="https://map.blitzortung.org"></iframe>
    </div>

   
</div>

<script>
// HF Band Analyzer - Tactical Edition
async function loadHFConditions() {
    const target = document.getElementById("hf-status");

    try {
        // HamQSL JSON endpoint
        const response = await fetch("https://hamqsl.com/solarjson.php");
        const data = await response.json();

        const solar = data.solar;
        const hf = data.hfconditions;

        // Extract values
        const sn = solar.sunspots;
        const kIndex = solar.kindex;
        const xray = solar.xray;
        const dayCond = hf.day;
        const nightCond = hf.night;

        // Tactical condition scoring
        function scoreBand(cond) {
            if (cond.includes("Poor")) return "🔴 Poor";
            if (cond.includes("Fair")) return "🟡 Fair";
            if (cond.includes("Good")) return "🟢 Good";
            return "⚪ Unknown";
        }

        target.innerHTML = `
            <strong>Solar Data</strong><br>
            Sunspots: ${sn}<br>
            K-Index: ${kIndex}<br>
            X-Ray: ${xray}<br><br>

            <strong>HF Conditions</strong><br>
            Daytime: ${scoreBand(dayCond)}<br>
            Nighttime: ${scoreBand(nightCond)}<br><br>

            <strong>Band Breakdown</strong><br>
            80m: ${kIndex <= 3 ? "🟢 Good" : "🔴 Noisy"}<br>
            40m: ${kIndex <= 4 ? "🟢 Good" : "🟡 Fair"}<br>
            20m: ${sn >= 50 ? "🟢 Hot" : "🟡 Fair"}<br>
            15m: ${sn >= 80 ? "🟢 Open" : "🔴 Closed"}<br>
            10m: ${sn >= 100 ? "🟢 DX Open" : "🔴 Weak"}<br>
        `;
    } catch (err) {
        target.innerHTML = "Error loading HF conditions.";
    }
}

loadHFConditions();
</script>


</body>
</html>
