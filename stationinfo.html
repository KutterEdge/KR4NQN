<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Station Dashboard</title>
<meta name="description" content="KR4NQN — Amateur and GMRS radio operator based in Citrus County, Florida.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">
    
<style>
  body {
    margin: 0;
    background: #14181A;
    font-family: Arial, sans-serif;
    color: #e6e6e6;
  }

  .header {
    text-align: center;
    padding: 25px 0 10px;
    font-size: 1.6rem;
    letter-spacing: 0.15em;
    color: #66fcf1;
  }


  .callsign {
    text-align: center;
    font-size: 2.6rem;
    font-weight: bold;
    letter-spacing: 0.25em;
    margin-bottom: 25px;
  }

  .callsign span:nth-child(1) { color: #ff3b3b; }
  .callsign span:nth-child(2) { color: #ffffff; }
  .callsign span:nth-child(3) { color: #3b6cff; }
  .callsign span:nth-child(4) { color: #ff3b3b; }
  .callsign span:nth-child(5) { color: #ffffff; }
  .callsign span:nth-child(6) { color: #3b6cff; }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 25px;
    padding: 0 40px 40px;
  }

  .panel {
    background: #000000;
    border: 2px solid #2bff00;
    border-radius: 10px;
    padding: 20px;
    box-shadow: 0 0 25px rgb(4, 0, 253);
  }

  .panel-title {
    font-size: 2rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: #ff0000;
    margin-bottom: 15px;
    text-align: center;
  }

  .time {
    font-size: 5rem;
    text-align: center;
    margin: 10px 0;
  }

  iframe {
    width: 100%;
    height: 260px;
    border: none;
    border-radius: 10px;
  }

  .data {
    font-size: 1.2rem;
    text-align: center;
    margin-top: 10px;
  }
</style>
</head>

<body>
<div class="header">
      
      <nav>|
        <a href="https://www.qrz.com/db/KR4NQN" target="_blank">QRZ</a>|
        <a href="https://wireless2.fcc.gov/UlsApp/UlsSearch/results.jsp" target="_blank">FCC
          license</a>|
      </nav>
    </div>
<div class="header">Station Clock & Propagation Dashboard</div>

<div class="callsign">
  <span>K</span><span>R</span><span>4</span><span>N</span><span>Q</span><span>N</span>
</div>

<div class="grid">

  <!-- UTC Clock -->
  <div class="panel">
    <div class="panel-title">UTC Time</div>
    <div id="utcTime" class="time">--:--:--</div>
    <br><div class="panel-title">Local Time</div>
    <div id="localTime" class="time">--:--:--</div>
  </div>

  <div class="panel">
  <div class="panel-title">VHF Propagation (PSKReporter)</div>

  <div style="margin-bottom:10px;">
    <button onclick="setBand('50')">50 MHz</button>
    <button onclick="setBand('144')">144 MHz</button>
    <button onclick="setBand('222')">222 MHz</button>
    <button onclick="setBand('432')">432 MHz</button>
  </div>

  <div id="vhfmap" style="height: 500px; border-radius: 10px;"></div>
</div>



  <!-- Local Clock -->
  <div class="panel">
    <center><img src="img/me1.png"></center>
  </div>


<script>
  function pad(n) { return n.toString().padStart(2, '0'); }

  function updateTimes() {
    const now = new Date();

    // Local
    const lh = pad(now.getHours());
    const lm = pad(now.getMinutes());
    const ls = pad(now.getSeconds());
    document.getElementById('localTime').textContent = `${lh}:${lm}:${ls}`;

    // UTC
    const uh = pad(now.getUTCHours());
    const um = pad(now.getUTCMinutes());
    const us = pad(now.getUTCSeconds());
    document.getElementById('utcTime').textContent = `${uh}:${um}:${us}`;
  }

  updateTimes();
  setInterval(updateTimes, 1000);
</script>

<script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

</body>
</html>
