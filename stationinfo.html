<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Station Dashboard</title>
<meta name="description" content="KR4NQN — Amateur and GMRS radio operator based in Citrus County, Florida.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">
    
<style>
  body {
    margin: 0;
    background: #14181A;
    font-family: Arial, sans-serif;
    color: #e6e6e6;
  }

  .header {
    text-align: center;
    padding: 25px 0 10px;
    font-size: 1.6rem;
    letter-spacing: 0.15em;
    color: #66fcf1;
  }


  .callsign {
    text-align: center;
    font-size: 2.6rem;
    font-weight: bold;
    letter-spacing: 0.25em;
    margin-bottom: 25px;
  }

  .callsign span:nth-child(1) { color: #ff3b3b; }
  .callsign span:nth-child(2) { color: #ffffff; }
  .callsign span:nth-child(3) { color: #3b6cff; }
  .callsign span:nth-child(4) { color: #ff3b3b; }
  .callsign span:nth-child(5) { color: #ffffff; }
  .callsign span:nth-child(6) { color: #3b6cff; }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 25px;
    padding: 0 40px 40px;
  }

  .panel {
    background: #000000;
    border: 2px solid #2bff00;
    border-radius: 10px;
    padding: 20px;
    box-shadow: 0 0 25px rgb(4, 0, 253);
  }

  .panel-title {
    font-size: 2rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: #ff0000;
    margin-bottom: 15px;
    text-align: center;
  }

  .time {
    font-size: 5rem;
    text-align: center;
    margin: 10px 0;
  }

  iframe {
    width: 100%;
    height: 260px;
    border: none;
    border-radius: 10px;
  }

  .data {
    font-size: 1.2rem;
    text-align: center;
    margin-top: 10px;
  }
</style>
</head>

<body>
<div class="header">
      
      <nav>|
        <a href="https://www.qrz.com/db/KR4NQN" target="_blank">QRZ</a>|
        <a href="https://wireless2.fcc.gov/UlsApp/UlsSearch/results.jsp" target="_blank">FCC
          license</a>|
      </nav>
    </div>
<div class="header">Station Clock & Propagation Dashboard</div>

<div class="callsign">
  <span>K</span><span>R</span><span>4</span><span>N</span><span>Q</span><span>N</span>
</div>

<div class="grid">

  <!-- UTC Clock -->
  <div class="panel">
    <div class="panel-title">UTC Time</div>
    <div id="utcTime" class="time">--:--:--</div>
    <br><div class="panel-title">Local Time</div>
    <div id="localTime" class="time">--:--:--</div>
  </div>
  
  <div class="panel">
  <div class="panel-title">VHF Propagation Map</div>
  <iframe 
    src="https://vhf.dxview.org/map?center=34.24,-86.57,5.0"
    style="width:100%; height:600px; border:none; border-radius:10px;"
    sandbox="allow-scripts allow-forms"
  ></iframe>
</div>



  <!-- Local Clock -->
  <div class="panel">
    <center><img src="img/me1.png"></center>
  </div>


<script>
  function pad(n) { return n.toString().padStart(2, '0'); }

  function updateTimes() {
    const now = new Date();

    // Local
    const lh = pad(now.getHours());
    const lm = pad(now.getMinutes());
    const ls = pad(now.getSeconds());
    document.getElementById('localTime').textContent = `${lh}:${lm}:${ls}`;

    // UTC
    const uh = pad(now.getUTCHours());
    const um = pad(now.getUTCMinutes());
    const us = pad(now.getUTCSeconds());
    document.getElementById('utcTime').textContent = `${uh}:${um}:${us}`;
  }

  updateTimes();
  setInterval(updateTimes, 1000);
</script>

<script>
async function loadSolarData() {
  const box = document.getElementById("solarData");

  try {
    const response = await fetch("https://vhf.dxview.org/map?center=34.24,-86.57,5.0");
    const data = await response.json();

    const s = data.solar;
    const g = data.geomag;

    box.innerHTML = `
      <div style="font-size:1.3rem; margin-bottom:10px;">
        <strong>SFI:</strong> ${s.sfi} &nbsp; | &nbsp;
        <strong>Sunspots:</strong> ${s.sunspots}
      </div>

      <div style="font-size:1.3rem; margin-bottom:10px;">
        <strong>A-index:</strong> ${g.aindex} &nbsp; | &nbsp;
        <strong>K-index:</strong> ${g.kindex}
      </div>

      <div style="font-size:1.2rem; margin-bottom:10px;">
        <strong>X-ray Flux:</strong> ${s.xray}
      </div>

      <div style="font-size:1.2rem;">
        <strong>Conditions:</strong> ${g.conditions}
      </div>
    `;
  } catch (err) {
    box.innerHTML = "Error loading solar data.";
  }
}

loadSolarData();
setInterval(loadSolarData, 60000);
</script>


</body>
</html>
