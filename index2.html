<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KR4NQN Shack Dashboard</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #00ffcc;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
            --border-color: #333333;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        h1, h2, h3 {
            margin: 0;
        }

        .callsign {
            color: var(--accent-color);
            font-size: 2.5rem;
            letter-spacing: 2px;
        }

        .utc-clock {
            font-size: 1.5rem;
            font-family: monospace;
            background: #000;
            padding: 5px 15px;
            border-radius: 5px;
            border: 1px solid var(--border-color);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .dashboard-grid.large {
            grid-template-columns: 2fr 1fr;
        }

        @media (max-width: 900px) {
            .dashboard-grid.large {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .card h2 {
            font-size: 1.2rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            margin-bottom: 15px;
            color: var(--accent-color);
        }

        .widget-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 150px;
            background: #151515;
            border-radius: 4px;
            overflow: hidden;
        }

        .logbook-table {
            width: 100%;
            border-collapse: collapse;
            font-family: monospace;
            font-size: 0.9rem;
        }

        .logbook-table th, .logbook-table td {
            border: 1px solid var(--border-color);
            padding: 8px;
            text-align: left;
        }

        .logbook-table th {
            background-color: #252525;
            color: var(--accent-color);
        }

        .logbook-table tr:nth-child(even) {
            background-color: #1a1a1a;
        }

        .quick-links a {
            display: block;
            color: var(--text-color);
            text-decoration: none;
            padding: 8px;
            margin-bottom: 5px;
            background: #252525;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .quick-links a:hover {
            background: var(--accent-color);
            color: #000;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <div>
            <div class="callsign">KR4NQN</div>
            <div style="color: var(--text-muted);">Amateur Radio Shack Dashboard</div>
        </div>
        <div class="utc-clock" id="utc-clock">00:00:00 UTC</div>
    </header>

    <!-- Top Row: Propagation and Solar Data Widgets -->
    <div class="dashboard-grid">
        <!-- Solar Banner Widget (HamQSL) -->
        <div class="card">
            <h2>Solar-Terrestrial Data</h2>
            <div class="widget-container">
                <a href="https://hamqsl.com" target="_blank">
                    <img src="https://hamqsl.com" alt="Solar Data">
                </a>
            </div>
        </div>

        <!-- HF Propagation Conditions -->
        <div class="card">
            <h2>HF Propagation (24h)</h2>
            <div class="widget-container">
                <a href="https://hamqsl.com" target="_blank">
                    <img src="https://hamqsl.com" alt="Solar Propagation">
                </a>
            </div>
        </div>

        <!-- Station Info & Quick Links -->
        <div class="card">
            <h2>Station Resources</h2>
            <div class="quick-links">
                <a href="https://qrz.com/db/KR4NQN" target="_blank">My QRZ.com Profile</a>
                <a href="https://dxwatch.com" target="_blank">DX Watch Cluster</a>
                <a href="index.html">Home</a>
                <a href="https://citrusham.org" target="_blank">Citrus County Amatuer Radio Club</a>
            </div>
        </div>
    </div>

    <!-- Bottom Row: Logbook and Map --><div class="card">
            <h2>Live QRZ Logbook & Profile (Auto-Updates)</h2>
            <!-- Embedded QRZ Frame handles session authentication automatically -->
            <iframe src="https://qrz.com" height="550px"></iframe>
        </div>

        <!-- Greyline / Space Weather Map -->
        <div class="card">
            <h2>Real-time Greyline Map</h2>
            <div class="widget-container">
                <!-- Using an open-source real-time map iframe alternative -->
                <iframe src="https://windy.com" 
                        width="100%" 
                        height="250px" 
                        frameborder="0" 
                        style="border: none; border-radius: 4px;">
                </iframe>
            </div>
        </div>
    </div>

    <script>
        // Real-Time UTC Clock Function
        function updateUTCClock() {
            const now = new Date();
            const utcString = now.toISOString().replace('T', ' ').substring(0, 19) + ' UTC';
            document.getElementById('utc-clock').textContent = utcString.split(' ')[1] + ' UTC';
        }
        
        setInterval(updateUTCClock, 1000);
        updateUTCClock();
    </script>
</body>
</html>
