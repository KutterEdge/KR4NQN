<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KR4NQN Dashboard</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,700|Roboto+Mono:300,400,700">
  <style>
    body {
      margin: 0;
      font-family: "Roboto", sans-serif;
      background: #050505;
      color: #e0e0e0;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 16px 24px;
      background: #000;
      border-bottom: 1px solid #222;
    }

    .brand-title {
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 1px;
    }

    .brand-sub {
      font-size: 13px;
      color: #9f9f9f;
      margin-top: 4px;
    }

    .callsign-pill {
      display: inline-flex;
      gap: 6px;
      margin-top: 8px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid #333;
      font-size: 12px;
      background: #080808;
    }

    .header-right {
      text-align: right;
      font-size: 13px;
    }

    .status-line {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #2ecc71;
      box-shadow: 0 0 6px rgba(46, 204, 113, 0.8);
    }

    nav a {
      color: #e0e0e0;
      text-decoration: none;
      font-size: 13px;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .clock-utc {
      font-family: "Roboto Mono", monospace;
      color: #66fcf1;
      letter-spacing: 1px;
    }

    .clock-local {
      font-family: "Roboto Mono", monospace;
      color: #45a29e;
      letter-spacing: 1px;
    }

    main.grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      padding: 16px 24px;
    }

    .card {
      background: #0a0a0a;
      border: 1px solid #222;
      border-radius: 6px;
      box-shadow:
        inset 0 0 12px rgba(0,0,0,0.8),
        0 0 4px rgba(0,0,0,0.6);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid #222;
      background: #050505;
    }

    .card-title {
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .card-tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid #444;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #9f9f9f;
    }

    .card-body {
      padding: 12px;
      font-size: 13px;
    }

    .time-row {
      display: flex;
      gap: 16px;
      margin-bottom: 12px;
    }

    .time-block {
      flex: 1;
      background: #050505;
      border-radius: 4px;
      padding: 8px;
      border: 1px solid #222;
    }

    .time-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #9f9f9f;
      margin-bottom: 4px;
    }

    .time-value {
      font-family: "Roboto Mono", monospace;
      font-size: 20px;
      margin-bottom: 4px;
    }

    .time-date {
      font-size: 11px;
      color: #b0b0b0;
    }

    .metrics-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .metric-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid #333;
      background: #080808;
      font-size: 11px;
    }

    .metric-pill strong {
      color: #2ecc71;
      font-weight: 500;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .list-item {
      display: grid;
      grid-template-columns: 1.5fr 1fr auto;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 4px;
      background: #050505;
      border: 1px solid #222;
      font-size: 12px;
    }

    .list-label {
      color: #b0b0b0;
    }

    .list-value {
      font-weight: 500;
    }

    .badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .badge-success {
      background: #2ecc71;
      color: #000;
    }

    .badge-warning {
      background: #f1c40f;
      color: #000;
    }


  </style>

   <style>
        :root { --bg: #1e1e2e; --surface: #252538; --text: #cdd6f4; --accent: #89b4fa; }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .card { background: var(--surface); padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .form-group { display: flex; flex-direction: column; margin-bottom: 15px; }
        label { margin-bottom: 5px; font-weight: bold; font-size: 0.9rem; }
        input, select, button { padding: 10px; border-radius: 6px; border: 1px solid #45475a; background: #11111b; color: #fff; }
        button { background: var(--accent); color: #11111b; font-weight: bold; cursor: pointer; border: none; }
        button:hover { opacity: 0.9; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #45475a; }
        th { background: #11111b; }
        .status { padding: 10px; border-radius: 6px; margin-bottom: 15px; font-weight: bold; display: none; }
    </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-title">KR4NQN Dashboard</div>
      <div class="brand-sub">Amateur Radio • Citrus County, FL • Live shack overview</div>
      <div class="callsign-pill">
        <span>KR4NQN</span>
        <span>•</span>
        <span>WSDX985</span>
      </div>
    </div>

    <div class="header-right">
      <div class="status-line">
        <span class="status-dot"></span>
        <span>Station status: Online</span>
      </div>
      <div class="status-line">
        <span>Last refresh:</span>
        <span id="last-refresh">—</span>
      </div>
      <div class="status-line">
        <span id="utcClock" class="clock-utc">--:--:-- UTC</span>
        <span>•</span>
        <span id="localClock" class="clock-local">--:--:-- LOCAL</span>
      </div>
      <nav>
        <a href="index.html">Home</a> |
        <a href="https://www.qrz.com/db/KR4NQN" target="_blank">QRZ</a> |
        <a href="https://wireless2.fcc.gov/UlsApp/UlsSearch/results.jsp" target="_blank">FCC license</a>
      </nav>
    </div>
  </header>

  <div class="container">
        <h1>📻 QRZ Logbook Manager</h1>
        
        <!-- Logbook Display -->
        <div class="card">
            <h2>Recent Contacts</h2>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Date/Time</th>
                            <th>Callsign</th>
                            <th>Band</th>
                            <th>Mode</th>
                            <th>RST</th>
                        </tr>
                    </thead><tbody id="logTableBody">
                <!-- GitHub Actions will automatically insert your data rows here daily -->
            </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Load saved settings on page load
        document.getElementById('apiKey').value = localStorage.getItem('qrz_api_key') || '';
        document.getElementById('userAgent').value = localStorage.getItem('qrz_user_agent') || 'GitHubPagesLogbookViewer/1.0';

        // Direct QRZ requests from GitHub Pages hit CORS blocks, so we route through an open proxy
        const PROXY_URL = "https://corsproxy.io?"; 
        const QRZ_API_URL = "https://qrz.com";

        function showStatus(msg, isError = false) {
            const box = document.getElementById('statusBox');
            box.style.display = 'block';
            box.style.background = isError ? '#f38ba8' : '#a6e3a1';
            box.style.color = '#11111b';
            box.innerText = msg;
        }

        async function fetchLogbook() {
            const key = document.getElementById('apiKey').value;
            const ua = document.getElementById('userAgent').value;
            if(!key) return showStatus("Please enter your QRZ API Key.", true);

            localStorage.setItem('qrz_api_key', key);
            localStorage.setItem('qrz_user_agent', ua);
            showStatus("Fetching data from QRZ...");

            try {
                // QRZ expects an ADIF or XML payload via POST even for fetches
                const response = await fetch(`${PROXY_URL}${encodeURIComponent(QRZ_API_URL)}`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/x-www-form-urlencoded',
                        'User-Agent': ua
                    },
                    body: `KEY=${key}&ACTION=FETCH&STATUS=1`
                });
                
                const text = await response.text();
                // Note: QRZ responds in ADIF file format text. Parse it here:
                parseAndDisplayADIF(text);
                showStatus("Logbook updated successfully!");
            } catch (err) {
                showStatus("Network Error. Check your API key or CORS proxy.", true);
                console.error(err);
            }
        }

        function parseAndDisplayADIF(adifText) {
            const tbody = document.getElementById('logTableBody');
            if (!adifText.includes('<call')) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;color:#f38ba8;">No records found or invalid API key configuration.</td></tr>`;
                return;
            }
            
            // Simple regex parser to extract common amateur radio fields from ADIF string
            const records = adifText.split(/<qso_date/i).slice(1);
            tbody.innerHTML = '';
            
            records.forEach(rec => {
                const call = (rec.match(/<call:\d+>([^<]+)/i) || [,""])[1];
                const band = (rec.match(/<band:\d+>([^<]+)/i) || [,""])[1];
                const mode = (rec.match(/<mode:\d+>([^<]+)/i) || [,""])[1];
                const rst = (rec.match(/<rst_sent:\d+>([^<]+)/i) || [,""])[1];
                const date = (rec.match(/^:\d+>(\d{4})(\d{2})(\d{2})/i) || [,"","",""])[1] + "-" + 
                             (rec.match(/^:\d+>(\d{4})(\d{2})(\d{2})/i) || [,"","",""])[2] + "-" + 
                             (rec.match(/^:\d+>(\d{4})(\d{2})(\d{2})/i) || [,"","",""])[3];

                if(call) {
                    tbody.innerHTML += `<tr><td>${date}</td><td>${call.toUpperCase()}</td><td>${band}</td><td>${mode}</td><td>${rst}</td></tr>`;
                }
            });
        }

        async function submitQSO(e) {
            e.preventDefault();
            const key = document.getElementById('apiKey').value;
            const ua = document.getElementById('userAgent').value;
            if(!key) return showStatus("Please set your API key first.", true);

            const call = document.getElementById('call').value;
            const band = document.getElementById('band').value;
            const mode = document.getElementById('mode').value;
            const rst = document.getElementById('rst').value;

            // Format data into standard ADIF structure
            const adifData = `<CALL:${call.length}>${call}<BAND:${band.length}>${band}<MODE:${mode.length}>${mode}<RST_SENT:${rst.length}>${rst}<EOR>`;
            showStatus("Submitting QSO to QRZ...");

            try {
                const response = await fetch(`${PROXY_URL}${encodeURIComponent(QRZ_API_URL)}`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/x-www-form-urlencoded',
                        'User-Agent': ua
                    },
                    body: `KEY=${key}&ACTION=INSERT&ADIF=${encodeURIComponent(adifData)}`
                });
                const resText = await response.text();
                showStatus("QSO Sent! Response: " + resText.split('\n')[0]);
                fetchLogbook(); // Refresh list
            } catch(err) {
                showStatus("Failed to submit QSO.", true);
            }
        }
    </script>

</body>
</html>
