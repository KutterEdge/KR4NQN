    <script>
        tailwind.config = {

    <style>
        /* CRT Scanline & Tactical Overlay Effects */
        .crt-overlay {
            background: linear-gradient(rgba(18, 20, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%), linear-gradient(90deg, rgba(80, 120, 40, 0.03), rgba(0, 255, 100, 0.01), rgba(0, 50, 0, 0.03));
            background-size: 100% 3px, 6px 100%;
            pointer-events: none;
        }

        .glow-lime {
            text-shadow: 0 0 8px rgba(163, 230, 53, 0.6), 0 0 15px rgba(163, 230, 53, 0.3);
        }
        .glow-amber {
            text-shadow: 0 0 8px rgba(217, 119, 6, 0.7), 0 0 15px rgba(217, 119, 6, 0.3);
        }
        .box-glow-lime {
            box-shadow: 0 0 15px -3px rgba(163, 230, 53, 0.25), inset 0 0 10px -5px rgba(163, 230, 53, 0.2);
        }

        /* Custom Scrollbar Styles */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #141a12;
        }
        ::-webkit-scrollbar-thumb {
            background: #32402b;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a3e635;
        }

        /* LED Pulse Animations */
        @keyframes pulse-fast {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.95); }
        }
        .led-active {
            animation: pulse-fast 1.2s infinite ease-in-out;
        }

        /* Custom Map Styles & Radar Pulse */
        #leaflet-map-container {
            background-color: #0b1009;
            height: 480px;
            width: 100%;
            border-radius: 0.5rem;
        }

        .qth-pulse-icon {
            position: relative;
        }
        .qth-pulse-icon::after {
            content: '';
            position: absolute;
            width: 24px;
            height: 24px;
            top: -6px;
            left: -6px;
            border-radius: 50%;
            border: 2px solid #a3e635;
            animation: qth-beacon 1.8s infinite ease-out;
        }
        @keyframes qth-beacon {
            0% { transform: scale(0.3); opacity: 1; }
            100% { transform: scale(2.2); opacity: 0; }
        }

        /* Leaflet Dark Customization */
        .leaflet-container {
            background: #0b1009 !important;
            font-family: 'Share Tech Mono', monospace !important;
        }
        .leaflet-control-zoom a {
            background-color: #1e261a !important;
            color: #a3e635 !important;
            border-color: #32402b !important;
        }
        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            background: #1e261a !important;
            color: #d1fae5 !important;
            border: 1px solid #32402b !important;
            font-family: 'Share Tech Mono', monospace !important;
        }
    </style>
</head>
<body class="bg-tactical-bg text-slate-200 font-sans min-h-screen relative overflow-x-hidden select-none flex flex-col items-center justify-start p-2 sm:p-4">

    <!-- Centered Main Dashboard Frame -->
    <div class="w-full max-w-7xl mx-auto border border-tactical-border rounded-xl bg-tactical-card/60 shadow-2xl backdrop-blur overflow-hidden my-auto">

        <!-- Header -->

                    <div class="flex items-center space-x-3">

                        </div>
                        <div>
                            <div class="flex items-center space-x-2">
                                <h1 class="font-display font-black text-2xl tracking-wider text-tactical-lime glow-lime">KR4NQN</h1>
                                <span class="px-2 py-0.5 text-xs font-mono font-semibold rounded bg-lime-950 text-tactical-lime border border-tactical-lime/40 flex items-center gap-1.5">
                                    <span class="w-2 h-2 rounded-full bg-tactical-lime led-active inline-block"></span>
                                    ON AIR

                            <p class="text-xs font-mono text-slate-400">BEVERLY HILLS, FL // GRID: EL88sv // QTH ACTIVE</p>
                        </div>
                    </div>
                </div>

                <!-- Clocks & Station Gauges -->
                <div class="flex items-center justify-around md:justify-end w-full md:w-auto gap-3 sm:gap-4 font-mono text-xs border-t md:border-t-0 border-tactical-border pt-2 md:pt-0">
                    <!-- Home Button -->
                    <div class="text-center px-4 py-5 bg-tactical-bg/80 rounded border border-tactical-border">

                    </div>
                    <!-- Local Clock -->
                    <div class="text-center px-4 py-3 bg-tactical-bg/80 rounded border border-tactical-border">
                        <div class="text-slate-400 text-[10px] uppercase tracking-wider">Local Time</div>
                        <div id="clock-local" class="text-slate-200 font-bold text-sm">--:--:--</div>
                    </div>
                    <!-- UTC Clock -->
                    <div class="text-center px-4 py-3 bg-tactical-lime/10 rounded border border-tactical-lime/30 box-glow-lime">
                        <div class="text-tactical-lime/80 text-[10px] uppercase font-bold tracking-widest">UTC Time</div>
                        <div id="clock-utc" class="text-tactical-lime font-bold text-base glow-lime">--:--:--</div>
                    </div>
                </div>
            </div>
        </header>

        <main class="p-4 sm:p-6 space-y-6">


            <!-- ROW 3: QRZ LOGBOOK & STATION FEED -->
            <section class="bg-tactical-bg/60 border border-tactical-border rounded-xl p-4">
                <div class="flex flex-col md:flex-row items-start md:items-center justify-between pb-3 border-b border-tactical-border gap-3 mb-4">
                    <h2 class="font-display text-sm font-semibold text-tactical-lime tracking-wider flex items-center gap-2">
                        <i class="fa-solid fa-book text-tactical-lime"></i> QRZ LOGBOOK & STATION FEED
                    </h2>
                </div>

                <!-- QRZ Widget iFrame View Centered -->
                <div id="tab-content-qrz-widget" class="log-tab-content block">
                    <div class="bg-tactical-card border border-tactical-border px-3 py-2 font-mono text-[11px] text-slate-400 flex flex-wrap justify-between items-center gap-2 mb-2 rounded-t">
                        <span class="flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-tactical-lime led-active"></span>
                            <span>KR4NQN: <strong class="text-tactical-lime">QRZ Logbook Widget</strong></span>
                        </span>
                    </div>
                    <div class="relative w-full rounded-b-lg bg-amber-100 border border-tactical-border overflow-hidden flex justify-center items-center p-2" style="min-height: 400px";>
                        <iframe align="top" frameborder="0" height="500" scrolling="yes" src="https://logbook.qrz.com/lbstat/KR4NQN/" class="w-full max-w-4x rounded border border-tactical-border"></iframe>
                    </div>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="border-t border-tactical-border bg-tactical-card/90 py-4 font-mono text-xs text-center text-slate-400">
            <p class="text-red-900 font-bold">KR4NQN COMMAND DASHBOARD // AMATEUR RADIO STATION OPERATING SYSTEM</p>
            <p class="text-[20px] text-white mt">73 KR4NQN // BEVERLY HILLS, FL // GRID EL88sv</p>
        </footer>
    </div>

        </main>

    <script>
        /* ====================================================================
           1. REAL-TIME CLOCKS ENGINE
           ==================================================================== */
        function updateClocks() {
            const now = new Date();
            
            // UTC Time
            const utcHours = String(now.getUTCHours()).padStart(2, '0');
            const utcMinutes = String(now.getUTCMinutes()).padStart(2, '0');
            const utcSeconds = String(now.getUTCSeconds()).padStart(2, '0');
            document.getElementById('clock-utc').textContent = `${utcHours}:${utcMinutes}:${utcSeconds}`;

            // Local Time
            const localHours = String(now.getHours()).padStart(2, '0');
            const localMinutes = String(now.getMinutes()).padStart(2, '0');
            const localSeconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock-local').textContent = `${localHours}:${localMinutes}:${localSeconds}`;
        }
        setInterval(updateClocks, 1000);
        updateClocks();

        /* ====================================================================
           2. AUDIO TOGGLE LOGIC
           ==================================================================== */
        let audioActive = false;
        const audioBtn = document.getElementById('master-audio-toggle');
        const audioIcon = document.getElementById('master-audio-icon');
        const audioText = document.getElementById('master-audio-text');

        audioBtn.addEventListener('click', () => {
            audioActive = !audioActive;
            if (audioActive) {
                audioIcon.className = 'fa-solid fa-volume-high text-tactical-lime';
                audioText.textContent = 'Audio On';
                audioText.classList.add('text-tactical-lime');
            } else {
                audioIcon.className = 'fa-solid fa-volume-xmark text-slate-500';
                audioText.textContent = 'Audio Off';
                audioText.classList.remove('text-tactical-lime');
            }
        });

        /* ====================================================================
           3. MAIDENHEAD GRID & AZIMUTH BEARING CALCULATOR
           ==================================================================== */
        const QTH_LAT = 28.9178;  // Beverly Hills, FL
        const QTH_LON = -82.4597;

        function gridToLatLon(grid) {
            grid = grid.toUpperCase().trim();
            if (grid.length < 4) return null;

            const fieldLon = (grid.charCodeAt(0) - 65) * 20 - 180;
            const fieldLat = (grid.charCodeAt(1) - 65) * 10 - 90;
            const squareLon = parseInt(grid.charAt(2)) * 2;
            const squareLat = parseInt(grid.charAt(3)) * 1;

            let subLon = 1.0;
            let subLat = 0.5;

            if (grid.length >= 6) {
                subLon = ((grid.charCodeAt(4) - 65) + 0.5) * (2 / 24);
                subLat = ((grid.charCodeAt(5) - 65) + 0.5) * (1 / 24);
            }

            return {
                lat: fieldLat + squareLat + subLat,
                lon: fieldLon + squareLon + subLon
            };
        }

        function calculateBearingAndDistance(lat1, lon1, lat2, lon2) {
            const rad = Math.PI / 180;
            const phi1 = lat1 * rad;
            const phi2 = lat2 * rad;
            const deltaLambda = (lon2 - lon1) * rad;

            // Bearing calculation
            const y = Math.sin(deltaLambda) * Math.cos(phi2);
            const x = Math.cos(phi1) * Math.sin(phi2) - Math.sin(phi1) * Math.cos(phi2) * Math.cos(deltaLambda);
            let bearing = Math.atan2(y, x) * (180 / Math.PI);
            bearing = (bearing + 360) % 360;

            // Distance calculation (Haversine Formula)
            const R = 3958.8; // Radius of Earth in Miles
            const dLat = (lat2 - lat1) * rad;
            const dLon = (lon2 - lon1) * rad;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(phi1) * Math.cos(phi2) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            const distMiles = R * c;
            const distKm = distMiles * 1.60934;

            return { bearing, distMiles, distKm };
        }

        function getCardinalDirection(angle) {
            const directions = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
            return directions[Math.round(angle / 45) % 8];
        }

        function processBearingCalculation() {
            const inputVal = document.getElementById('target-grid-input').value;
            let coords = gridToLatLon(inputVal);

            // Fallback lookup for common callsign prefixes if grid parsing fails
            if (!coords) {
                const prefixMap = {
                    'JA': { lat: 35.6762, lon: 139.6503 }, // Japan
                    'VK': { lat: -33.8688, lon: 151.2093 }, // Australia
                    'G':  { lat: 51.5074, lon: -0.1278 },   // UK
                    'PY': { lat: -23.5505, lon: -46.6333 }  // Brazil
                };
                const cleanInput = inputVal.toUpperCase().trim();
                for (let key in prefixMap) {
                    if (cleanInput.startsWith(key)) {
                        coords = prefixMap[key];
                        break;
                    }
                }
            }

            if (coords) {
                const res = calculateBearingAndDistance(QTH_LAT, QTH_LON, coords.lat, coords.lon);
                document.getElementById('res-bearing').textContent = `${Math.round(res.bearing)}° (${getCardinalDirection(res.bearing)})`;
                document.getElementById('res-dist-mi').textContent = `${Math.round(res.distMiles).toLocaleString()} mi`;
                document.getElementById('res-dist-km').textContent = `${Math.round(res.distKm).toLocaleString()} km`;
                document.getElementById('compass-needle').style.transform = `rotate(${res.bearing}deg)`;
            } else {
                document.getElementById('res-bearing').textContent = "INVALID GRID";
            }
        }

        document.getElementById('calc-bearing-btn').addEventListener('click', processBearingCalculation);
        document.getElementById('target-grid-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') processBearingCalculation();
        });

        /* ====================================================================
           4. LEAFLET LIVE DAY/NIGHT & GRAYLINE MAP ENGINE
           ==================================================================== */
        let map, nightLayer, subsolarMarker, graylineVisible = true, subsolarVisible = true;

        // Solar Position Calculation Algorithm
        function getSolarPosition(date) {
            const now = date || new Date();
            const julianDate = (now.getTime() / 86400000) + 2440587.5;
            const d = julianDate - 2451545.0;

            // Mean anomaly & ecliptic longitude
            const g = 357.529 + 0.98560028 * d;
            const q = 280.459 + 0.98564736 * d;
            const L = q + 1.915 * Math.sin(g * Math.PI / 180) + 0.020 * Math.sin(2 * g * Math.PI / 180);

            // Obliquity of the ecliptic
            const e = 23.439 - 0.0000004 * d;

            // Sun declination & Right Ascension
            const dec = Math.asin(Math.sin(e * Math.PI / 180) * Math.sin(L * Math.PI / 180)) * 180 / Math.PI;
            
            // Subsolar point calculation
            const utcHours = now.getUTCHours() + now.getUTCMinutes() / 60 + now.getUTCSeconds() / 3600;
            const sunLon = 180 - (utcHours * 15);

            return { lat: dec, lon: (sunLon > 180) ? sunLon - 360 : (sunLon < -180 ? sunLon + 360 : sunLon) };
        }

        // Calculate Night Terminator Polygon Coordinates
        function getTerminatorCoordinates(sunPos) {
            const coords = [];
            const sunLat = sunPos.lat * Math.PI / 180;
            const sunLon = sunPos.lon * Math.PI / 180;

            for (let lon = -180; lon <= 180; lon += 2) {
                const radLon = lon * Math.PI / 180;
                // Solar zenith calculation for terminator boundary
                const lat = Math.atan(-Math.cos(radLon - sunLon) / Math.tan(sunLat)) * 180 / Math.PI;
                coords.push([lat, lon]);
            }

            // Complete polygon surrounding the night hemisphere
            if (sunPos.lat >= 0) {
                coords.push([-90, 180]);
                coords.push([-90, -180]);
            } else {
                coords.push([90, 180]);
                coords.push([90, -180]);
            }

            return coords;
        }

        function initMap() {
            // Initialize Leaflet Map centered on QTH
            map = L.map('leaflet-map-container', {
                center: [20, 0],
                zoom: 2,
                minZoom: 1,
                maxZoom: 7,
                attributionControl: false
            });

            // CartoDB Dark Matter Tile Layer
            L.tileLayer('https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png?key=cb1_40ft_1_e9f7d6a8209200a15a99c6b1', {
                subdomains: 'abcd',
                maxZoom: 19
            }).addTo(map);

            // Custom Pulsing QTH Icon for Beverly Hills, FL
            const qthIcon = L.divIcon({
                className: 'qth-pulse-icon',
                html: '<div style="width: 12px; height: 12px; background-color: #a3e635; border-radius: 50%; border: 2px solid #141a12;"></div>',
                iconSize: [12, 12],
                iconAnchor: [6, 6]
            });

            const qthMarker = L.marker([QTH_LAT, QTH_LON], { icon: qthIcon }).addTo(map);
            qthMarker.bindPopup("<strong>KR4NQN STATION</strong><br>Beverly Hills, FL<br>Grid: EL88sv");

            // Subsolar Point Marker
            const sunIcon = L.divIcon({
                html: '<i class="fa-solid fa-sun text-amber-400 text-xl glow-amber"></i>',
                iconSize: [20, 20],
                iconAnchor: [10, 10]
            });
            subsolarMarker = L.marker([0, 0], { icon: sunIcon }).addTo(map);

            updateSolarMap();
            setInterval(updateSolarMap, 30000); // Auto update every 30 seconds
        }

        function updateSolarMap() {
            const sunPos = getSolarPosition();

            // Update Metrics Panel
            document.getElementById('solar-declination-val').textContent = `${sunPos.lat >= 0 ? '+' : ''}${sunPos.lat.toFixed(2)}°`;
            document.getElementById('subsolar-coord-val').textContent = `${Math.abs(sunPos.lat).toFixed(1)}°${sunPos.lat >= 0 ? 'N' : 'S'}, ${Math.abs(sunPos.lon).toFixed(1)}°${sunPos.lon >= 0 ? 'E' : 'W'}`;

            // Update Subsolar Marker Position
            if (subsolarMarker) {
                subsolarMarker.setLatLng([sunPos.lat, sunPos.lon]);
            }

            // Render/Update Night & Grayline Terminator Polygon
            const polyCoords = getTerminatorCoordinates(sunPos);

            if (nightLayer) {
                map.removeLayer(nightLayer);
            }

            nightLayer = L.polygon(polyCoords, {
                color: '#a3e635',       // Tactical Lime Grayline Border
                weight: graylineVisible ? 2.5 : 0,
                opacity: 0.9,
                fillColor: '#000000',   // Dark Night Shading
                fillOpacity: 0.55
            }).addTo(map);

            const now = new Date();
            document.getElementById('map-last-update').textContent = `${now.getUTCHours().toString().padStart(2, '0')}:${now.getUTCMinutes().toString().padStart(2, '0')} Z`;
        }

        // Toggle Controls
        document.getElementById('toggle-grayline-btn').addEventListener('click', (e) => {
            graylineVisible = !graylineVisible;
            e.target.textContent = `GRAYLINE: ${graylineVisible ? 'ON' : 'OFF'}`;
            e.target.className = `px-3 py-1 rounded font-bold transition-all ${graylineVisible ? 'bg-tactical-lime text-tactical-bg' : 'bg-tactical-card text-slate-400 border border-tactical-border'}`;
            updateSolarMap();
        });

        document.getElementById('toggle-sun-btn').addEventListener('click', (e) => {
            subsolarVisible = !subsolarVisible;
            e.target.textContent = `SUBSOLAR: ${subsolarVisible ? 'ON' : 'OFF'}`;
            if (subsolarVisible) {
                map.addLayer(subsolarMarker);
            } else {
                map.removeLayer(subsolarMarker);
            }
        });

        // Initialize Map on Load
        window.onload = function() {
            initMap();
            processBearingCalculation();
        };
    </script>
