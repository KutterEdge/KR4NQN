name: Update QRZ Logbook

on:
  schedule:
    # Runs every day at midnight UTC (Adjust this cron time if desired)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to manually trigger the update via the GitHub UI

jobs:
  update-log:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install requests

    - name: Run script to fetch data
      env:
        QRZ_API_KEY: ${{ secrets.QRZ_API_KEY }}
      run: python fetch_qrz.py

    - name: Commit and push if logbook changed
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        git add logbook.txt
        if git diff --staged --quiet; then
          echo "No changes to commit."
        else
          git commit -m "Automated QRZ logbook update"
          git push
        fi
